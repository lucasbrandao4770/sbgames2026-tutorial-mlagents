# Cada bloco abaixo de behaviors configura o treino de um Behavior Name específico do projeto Unity.
behaviors:
  # Nome do Behavior configurado no componente Behavior Parameters do GameObject do Flappy.
  # Precisa ser idêntico ao nome no Unity, senão o treinador não encontra o agente.
  FlappyAgent:
    # Algoritmo de treino: PPO (Proximal Policy Optimization), o padrão do ML-Agents.
    trainer_type: ppo

    # Hiperparâmetros do treino: os comuns a todos os algoritmos e os específicos do PPO.
    # Idênticos aos de FlappyBird_ppo.yaml. Como max_steps é dez vezes maior, a queda linear
    # da learning_rate, de beta e de epsilon também fica dez vezes mais lenta.
    hyperparameters:
      # Quantas amostras entram em cada passo do gradiente (cada minilote do buffer).
      batch_size: 256
      # Quantas amostras de experiência são coletadas antes de cada atualização.
      buffer_size: 1024
      # Taxa de aprendizado: o quanto o modelo muda a cada atualização.
      learning_rate: 3.0e-4
      # Faz a learning_rate cair linearmente até perto de zero ao longo do treino.
      learning_rate_schedule: linear

      # PPO-specific hyperparameters
      # Incentivo à exploração: valores maiores levam o agente a experimentar ações menos óbvias.
      beta: 5.0e-4
      # Limite de quanto a política pode mudar a cada atualização, o "P" de PPO.
      epsilon: 0.2
      # Parâmetro do cálculo de vantagem (GAE): equilibra viés e variância na estimativa de cada ação.
      lambd: 0.99
      # Quantas vezes o buffer inteiro é percorrido a cada atualização.
      num_epoch: 3

    # Configuration of the neural network
    # Configuração da rede neural que representa a política do agente, igual à de FlappyBird_ppo.yaml.
    network_settings:
      # Se true, normaliza as observações antes de entrar na rede.
      normalize: false
      # Quantos neurônios cada camada da rede tem.
      hidden_units: 128
      # Quantas camadas escondidas a rede tem.
      num_layers: 2

    # Trainer configurations common to all trainers
    # Total de passos de treino. Dez vezes o max_steps de FlappyBird_ppo.yaml (50 mil): não cabe nos
    # minutos do módulo ao vivo, por isso este arquivo só documenta o run de referência FlappyBird_ppo_500k,
    # cerca de 12 minutos e meio sem gráficos no Mac de teste, não um treino para os participantes rodarem no dia.
    max_steps: 500000
    # Passos considerados de uma vez no cálculo de vantagem, antes de "cortar" o trecho para o treino.
    time_horizon: 200
    # A cada quantos passos o treinador escreve um resumo (aparece no console e no TensorBoard).
    summary_freq: 2000
    # Quantos checkpoints (modelos intermediários) o treinador guarda ao longo do treino. Dobrado em
    # relação a FlappyBird_ppo.yaml (5), para manter uma amostra de checkpoints ao longo dos 500 mil passos.
    keep_checkpoints: 10
    # A cada quantos passos um checkpoint intermediário é salvo em disco. Cinco vezes o valor de
    # FlappyBird_ppo.yaml (10 mil), para manter uma quantidade parecida de checkpoints apesar do treino mais longo.
    checkpoint_interval: 50000

    # Fontes de recompensa usadas no treino.
    reward_signals:
      # environment reward (default)
      # Recompensa extrínseca: a que o próprio script do agente fornece via AddReward.
      extrinsic:
        # Peso da recompensa extrínseca na recompensa total usada para treinar.
        strength: 0.1
        # Fator de desconto: o quanto recompensas futuras valem menos que recompensas imediatas.
        gamma: 0.99
