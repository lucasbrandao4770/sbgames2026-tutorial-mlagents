# Template do desafio de design do Módulo 3.
# Regra do desafio: escolha um item do menu abaixo, mude só esse valor, escreva uma previsão de uma frase sobre o efeito esperado, treine com --run-id=ppo2 e compare a curva com o run ppo1 do Módulo 1 no TensorBoard (tensorboard --logdir results).
# Uma mudança por vez, sempre a partir desta configuração base, idêntica à do FlappyBird_ppo.yaml do Módulo 1.
# Cada run usa uma única seed, então um efeito isolado pode ficar dentro do ruído; antes de julgar qualquer mudança, use os vários runs ppo1 da sala (mesma configuração em todas as máquinas) como linha de base do ruído.
behaviors:
  FlappyAgent:
    trainer_type: ppo

    hyperparameters:
      # menu: batch_size, padrão 256, tente 512 ou 1024; lotes maiores suavizam o gradiente e deixam o treino mais estável, mas cada passo de atualização fica mais lento.
      batch_size: 256
      # menu: buffer_size, padrão 1024, tente 2048 ou 4096; buffers maiores juntam mais experiência antes de cada atualização, com mais memória e tempo por atualização.
      buffer_size: 1024
      # menu: learning_rate, padrão 3.0e-4, tente 1.0e-4 ou 1.0e-3; taxa mais alta aprende mais rápido mas arrisca instabilidade, taxa mais baixa é mais estável e mais lenta.
      learning_rate: 3.0e-4
      learning_rate_schedule: linear

      # PPO-specific hyperparameters
      # menu: beta, padrão 5.0e-4, tente 1.0e-2; beta mais alto aumenta o peso da entropia e incentiva mais exploração, útil se o agente travar sempre no mesmo comportamento.
      beta: 5.0e-4
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3

    # Configuration of the neural network
    network_settings:
      normalize: false
      # menu: hidden_units, padrão 128, tente 64 ou 256; redes maiores representam políticas mais complexas, mas treinam mais devagar e arriscam mais overfitting com pouco dado.
      hidden_units: 128
      # menu: num_layers, padrão 2, tente 1 ou 3; mais camadas aumentam a capacidade da rede à custa de treino mais lento e mais risco de instabilidade.
      num_layers: 2

    # Trainer configurations common to all trainers
    # menu: max_steps, padrão 50000, tente 100000; mais passos dão mais tempo de treino, mas o desafio tem teto de tempo e o treino para com Ctrl+C de qualquer forma no horário combinado.
    max_steps: 50000
    # menu: time_horizon, padrão 200, tente 64 ou 500; horizontes maiores propagam a recompensa por trechos mais longos do episódio, com atualizações mais caras.
    time_horizon: 200
    summary_freq: 2000
    keep_checkpoints: 5
    checkpoint_interval: 10000

    reward_signals:
      # environment reward (default)
      extrinsic:
        strength: 0.1
        # menu: reward_signals.extrinsic.gamma, padrão 0.99, tente 0.9 ou 0.999; gamma mais baixo valoriza recompensas próximas no tempo, mais alto olha mais para o futuro do episódio.
        gamma: 0.99

      # menu: reward_signals.curiosity, padrão desligado (bloco comentado abaixo), descomente para ligar; recompensa intrínseca por estados que o agente ainda prevê mal, incentivando exploração extra num jogo que já tem recompensa densa.
      # Valores padrão do trainer do mlagents 1.1.0: o TCC não usou curiosity neste ambiente, então não há valor de referência do TCC para strength.
      # curiosity:
      #   strength: 1.0
      #   gamma: 0.99
      #   learning_rate: 3.0e-4

      # menu: reward_signals.gail, padrão desligado (bloco comentado abaixo), descomente só se o teste do arquivo .demo tiver passado; recompensa extra por se aproximar da demonstração, além da recompensa do jogo.
      # Valores do run1 de python/configs/imitation/FlappyBird_run1.yaml; run2 usa strength 0.4 e run3 usa strength 0.1, ambos com Leve2FlappyAgentDemo.demo.
      # gail:
      #   demo_path: Demos/Level1FlappyAgentDemo.demo
      #   strength: 0.5

    # menu: behavioral_cloning, padrão desligado (bloco comentado abaixo), descomente só se o teste do arquivo .demo tiver passado; perda supervisionada que aproxima a política das ações da demonstração, além do sinal de PPO.
    # Valores do run1 de python/configs/imitation/FlappyBird_run1.yaml; run2 usa strength 0.4 e run3 usa strength 0.1, ambos com Leve2FlappyAgentDemo.demo.
    # behavioral_cloning:
    #   demo_path: Demos/Level1FlappyAgentDemo.demo
    #   strength: 1.0
