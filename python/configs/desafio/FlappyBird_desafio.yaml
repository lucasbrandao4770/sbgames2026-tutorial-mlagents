# Modelo do desafio de design do Módulo 3.
# Regra do desafio: escolha um item do menu abaixo, mude só esse valor, escreva uma previsão de uma frase sobre o efeito esperado, treine com --run-id=ppo2 e compare a curva com o run ppo1 do Módulo 1 no TensorBoard (tensorboard --logdir results).
# Uma mudança por vez, sempre a partir desta configuração base, idêntica à do FlappyBird_ppo.yaml do Módulo 1.
# Cada run usa uma única seed, então um efeito isolado pode ficar dentro do ruído; antes de julgar qualquer mudança, use os vários runs ppo1 da sala (mesma configuração em todas as máquinas) como linha de base do ruído.
# Para ligar um bloco comentado, apague os dois caracteres "# " (cerquilha e espaço) do início de cada linha dele. Apagar só a cerquilha deixa um espaço a mais no início da linha, e o mlagents-learn recusa o arquivo.
behaviors:
  FlappyAgent:
    trainer_type: ppo

    hyperparameters:
      # menu: batch_size, valor base 256, tente 64 ou 512; lotes menores dão mais passos de gradiente por atualização, com gradiente mais ruidoso, e lotes maiores dão menos passos, mais estáveis. A documentação pede batch_size bem menor que buffer_size (aqui 1024) e, com ações discretas, entre 32 e 512.
      batch_size: 256
      # menu: buffer_size, valor base 1024, tente 2048 ou 4096; buffers maiores juntam mais experiência antes de cada atualização, com mais memória e tempo por atualização.
      buffer_size: 1024
      # menu: learning_rate, valor base 3.0e-4, tente 1.0e-4 ou 1.0e-3; taxa mais alta aprende mais rápido mas arrisca instabilidade, taxa mais baixa é mais estável e mais lenta.
      learning_rate: 3.0e-4
      learning_rate_schedule: linear

      # Hiperparâmetros específicos do PPO
      # menu: beta, valor base 5.0e-4, tente 1.0e-2; beta mais alto aumenta o peso da entropia e incentiva mais exploração, útil se o agente travar sempre no mesmo comportamento.
      beta: 5.0e-4
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3

    # Configuração da rede neural
    network_settings:
      normalize: false
      # menu: hidden_units, valor base 128, tente 64 ou 256; redes maiores representam políticas mais complexas, mas treinam mais devagar, e a documentação do ML-Agents recomenda redes pequenas para problemas simples.
      hidden_units: 128
      # menu: num_layers, valor base 2, tente 1 ou 3; mais camadas aumentam a capacidade da rede à custa de treino mais lento e mais risco de instabilidade.
      num_layers: 2

    # Configurações comuns a todos os treinadores
    # menu: max_steps, valor base 50000, tente 100000; com learning_rate_schedule linear, a taxa de aprendizado, o beta e o epsilon caem até zero em max_steps, então dobrar o valor faz o aprendizado decair mais devagar, e é esse o efeito que aparece se o treino parar com Ctrl+C no horário combinado.
    max_steps: 50000
    # menu: time_horizon, valor base 200, tente 64 ou 500; horizontes maiores usam mais recompensas reais antes de recorrer à estimativa de valor, com menos viés e mais variância, e horizontes menores fazem o contrário.
    time_horizon: 200
    summary_freq: 2000
    keep_checkpoints: 5
    checkpoint_interval: 10000

    reward_signals:
      # Recompensa do ambiente (padrão do ML-Agents)
      extrinsic:
        strength: 0.1
        # menu: reward_signals.extrinsic.gamma, valor base 0.99, tente 0.9 ou 0.999; gamma mais baixo valoriza recompensas próximas no tempo, mais alto olha mais para o futuro do episódio.
        gamma: 0.99

      # menu: reward_signals.curiosity, desligado no valor base (bloco comentado abaixo); recompensa intrínseca por transições que o agente ainda prevê mal, incentivando exploração extra.
      # strength 0.02 segue a faixa típica da documentação do ML-Agents (0.001 a 0.1). O padrão do mlagents é 1.0, dez vezes o peso da recompensa do jogo neste yaml, e faria a curiosidade dominar o treino. O TCC não usou curiosity neste ambiente.
      # curiosity:
      #   strength: 0.02
      #   gamma: 0.99
      #   learning_rate: 3.0e-4

      # menu: reward_signals.gail, desligado no valor base (bloco comentado abaixo), ligue só se a equipe confirmar no dia que a demonstração carrega contra o build; recompensa extra por se aproximar da demonstração, além da recompensa do jogo.
      # Valores do run1 de python/configs/imitation/FlappyBird_run1.yaml; run2 usa strength 0.4 e run3 usa strength 0.1, ambos com Leve2FlappyAgentDemo.demo.
      # gail:
      #   demo_path: Demos/Level1FlappyAgentDemo.demo
      #   strength: 0.5

    # menu: behavioral_cloning, desligado no valor base (bloco comentado abaixo), ligue só se a equipe confirmar no dia que a demonstração carrega contra o build; perda supervisionada que aproxima a política das ações da demonstração, além do sinal de PPO.
    # Valores do run1 de python/configs/imitation/FlappyBird_run1.yaml; run2 usa strength 0.4 e run3 usa strength 0.1, ambos com Leve2FlappyAgentDemo.demo.
    # behavioral_cloning:
    #   demo_path: Demos/Level1FlappyAgentDemo.demo
    #   strength: 1.0
